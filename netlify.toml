# Netlify: no build step, publish the repo as it is.
[build]
  publish = "."

# Always check for a fresh service worker and manifest so updates arrive straight away.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
